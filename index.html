<script>
  function updateLabelsOnly() {
    document.getElementById('lbl-code').innerText = document.getElementById('code-input').value || ' ';
    document.getElementById('lbl-subtext').innerText = document.getElementById('subtext-input').value || ' ';
  }

  function generateQR() {
    let rawLink = document.getElementById('link-input').value.trim();
    let targetUrl = "https://kelvin01lima-blip.github.io/OS-Viewer/";

    if (rawLink.includes("docs.google.com/spreadsheets/d/")) {
      const match = rawLink.match(/\/d\/([a-zA-Z0-9-_]+)/);
      if (match && match[1]) {
        targetUrl += `?id=${match[1]}`;
      }
    } else if (rawLink) {
      targetUrl = rawLink;
    }

    document.getElementById('status-text').innerText = "STATUS: OK! QR CODE FUTURISTA PRONTO!";
    document.getElementById('status-text').style.color = "#00ff66";

    // QR Code direto apontando para o leitor OS-Viewer
    const qrImageSrc = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&margin=0&ecc=L&data=${encodeURIComponent(targetUrl)}`;
    document.getElementById('qr-img').src = qrImageSrc;
    
    updateLabelsOnly();
  }

  function resetForm() {
    document.getElementById('link-input').value = '';
    document.getElementById('code-input').value = 'LOTE 122 - MOD 4993';
    document.getElementById('subtext-input').value = 'REF: CX-01';
    generateQR();
  }

  window.onload = generateQR;
</script>
