<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>CyberQR - Gerador de Etiquetas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #080b10;
      --panel-bg: rgba(13, 20, 33, 0.9);
      --cyan-glow: #00f0ff;
      --magenta-glow: #ff0055;
      --green-glow: #00ff66;
      --border-color: rgba(0, 240, 255, 0.3);
      --text-dim: #7a8c9e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-dark);
      color: #e0f2fe;
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    header {
      width: 100%; max-width: 1000px; display: flex; justify-content: space-between; align-items: center;
      padding: 15px 20px; margin-bottom: 20px; background: var(--panel-bg);
      border: 1px solid var(--border-color);
    }
    h1 { font-family: 'Orbitron', sans-serif; font-size: 1.4rem; color: #fff; }
    h1 span { color: var(--cyan-glow); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; width: 100%; max-width: 1000px; }
    @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
    .panel { background: var(--panel-bg); border: 1px solid var(--border-color); padding: 20px; }
    .panel-title { font-family: 'Orbitron', sans-serif; font-size: 0.95rem; color: var(--cyan-glow); margin-bottom: 15px; }
    .input-group { margin-bottom: 15px; }
    label { display: block; font-size: 0.8rem; color: var(--text-dim); margin-bottom: 5px; text-transform: uppercase; }
    input[type="text"] {
      width: 100%; padding: 10px; background: #04080f; border: 1px solid var(--border-color);
      color: #fff; font-family: 'Rajdhani', sans-serif; font-size: 1rem; outline: none;
    }
    .btn {
      width: 100%; padding: 12px; font-family: 'Orbitron', sans-serif; font-size: 0.85rem; font-weight: bold;
      background: var(--cyan-glow); color: #000; border: none; cursor: pointer; margin-top: 10px;
    }
    .preview-stage { display: flex; justify-content: center; align-items: center; min-height: 220px; background: #04080f; border: 1px dashed var(--border-color); padding: 15px; }
    .bopp-label {
      width: 165px; height: 105px; background: #fff; padding: 4px; color: #000;
      display: flex; flex-direction: column; align-items: center; justify-content: space-around;
    }
    .bopp-label img { width: 65px; height: 65px; }
    .label-code { font-family: Arial, sans-serif; font-size: 8px; font-weight: bold; color: #000; text-align: center; }
    .label-subtext { font-family: Arial, sans-serif; font-size: 6px; color: #333; text-align: center; }
    @media print {
      @page { size: 33mm 21mm; margin: 0; }
      body { background: #fff; padding: 0; margin: 0; display: block; }
      header, .panel:first-child, .panel-title { display: none; }
      .grid { display: block; width: 33mm; }
      .panel { border: none; background: transparent; padding: 0; }
      .preview-stage { background: transparent; border: none; min-height: 0; padding: 0; }
      .bopp-label { width: 33mm; height: 21mm; padding: 1mm; justify-content: flex-start; }
      .bopp-label img { width: 14mm; height: 14mm; }
      .label-code { font-size: 5pt; }
      .label-subtext { font-size: 4pt; }
    }
  </style>
</head>
<body>

  <header>
    <h1>CYBER<span>QR</span> // OS</h1>
    <div style="color: var(--green-glow); font-size: 0.8rem; font-family: 'Orbitron';">SISTEMA PRONTO</div>
  </header>

  <div class="grid">
    <div class="panel">
      <div class="panel-title">// DADOS DA ETIQUETA</div>
      
      <div class="input-group">
        <label for="link-input">Link da Planilha (Google Drive)</label>
        <input type="text" id="link-input" placeholder="Cole o link aqui..." oninput="gerar()">
      </div>

      <div class="input-group">
        <label for="code-input">Título da Etiqueta</label>
        <input type="text" id="code-input" value="LOTE 122 - MOD 4990" oninput="atualizarTexto()">
      </div>

      <div class="input-group">
        <label for="subtext-input">Sub-texto / SKU</label>
        <input type="text" id="subtext-input" value="REF: CX-01" oninput="atualizarTexto()">
      </div>

      <button class="btn" onclick="window.print()">IMPRIMIR ETIQUETA</button>
    </div>

    <div class="panel">
      <div class="panel-title">// PRÉ-VISUALIZAÇÃO (33x21mm)</div>
      <div class="preview-stage">
        <div class="bopp-label">
          <img id="qr-img" src="" alt="QR Code">
          <div>
            <div class="label-code" id="lbl-code">LOTE 122 - MOD 4990</div>
            <div class="label-subtext" id="lbl-subtext">REF: CX-01</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function atualizarTexto() {
      document.getElementById('lbl-code').innerText = document.getElementById('code-input').value || ' ';
      document.getElementById('lbl-subtext').innerText = document.getElementById('subtext-input').value || ' ';
    }

    function gerar() {
      var raw = document.getElementById('link-input').value.trim();
      var urlFinal = "https://kelvin01lima-blip.github.io/OS-Viewer/";

      if (raw.indexOf("docs.google.com/spreadsheets/d/") !== -1) {
        var m = raw.match(/\/d\/([a-zA-Z0-9-_]+)/);
        if (m && m[1]) {
          urlFinal += "?id=" + m[1];
        }
      } else if (raw !== "") {
        urlFinal = raw;
      }

      var src = "https://api.qrserver.com/v1/create-qr-code/?size=200x200&margin=0&data=" + encodeURIComponent(urlFinal);
      document.getElementById('qr-img').src = src;
      atualizarTexto();
    }

    window.onload = gerar;
  </script>
</body>
</html>
